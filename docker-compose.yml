services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: uploader
      MYSQL_USER: uploader
      MYSQL_PASSWORD: uploader
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/migrations/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: uploader
      DB_USER: uploader
      DB_PASSWORD: uploader
      CHUNK_SIZE: 5242880
      STORAGE_PATH: /var/www/html/storage/uploads
      FAILURE_SIMULATION: "false"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - upload_data:/var/www/html/storage
    restart: unless-stopped

  finalizer:
    build: ./backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: uploader
      DB_USER: uploader
      DB_PASSWORD: uploader
      CHUNK_SIZE: 5242880
      STORAGE_PATH: /var/www/html/storage/uploads
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - upload_data:/var/www/html/storage
    command: ["php", "worker/finalize-worker.php"]
    restart: unless-stopped

  cleanup:
    build: ./backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: uploader
      DB_USER: uploader
      DB_PASSWORD: uploader
      CHUNK_SIZE: 5242880
      STORAGE_PATH: /var/www/html/storage/uploads
      CLEANUP_MAX_AGE: 86400
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - upload_data:/var/www/html/storage
    command: ["php", "worker/cleanup-worker.php"]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - nginx

volumes:
  mysql_data:
  upload_data:
  frontend_node_modules:
